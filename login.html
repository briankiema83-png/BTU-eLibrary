
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | BTU ELIBRARY</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body class="login-page">

    <header class="site-header">
        <div class="brand">
            <div class="brand-icon">B</div>
            <div>
                <h1>BTU ELIBRARY</h1>
                <p>Bomet University</p>
            </div>
        </div>

        <a href="index.html" class="login-button">Back to Home</a>
    </header>

    <main class="login-container">
        <section class="login-card">
            <div class="login-icon">🔐</div>

            <h2>Welcome Back</h2>
            <p class="login-description">
                Sign in to access your university learning resources.
            </p>

            <form id="login-form">

<div class="form-group">
    <label for="user-email">Email Address:</label>
    <input
        type="email"
        id="user-email"
        name="user-email"
        placeholder="Enter your email address"
        autocomplete="email"
        required
    >
</div>


                <div class="form-group">
                    <label for="password">Password:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="sign-in-button">
                    Sign In
                </button>
            </form>


</form>

<p class="forgot-password">
    <a href="forgot-password.html">Forgot Password?</a>
</p>

<p class="login-note">
    Access is intended for authorized university users.
</p>

        </section>
    </main>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
