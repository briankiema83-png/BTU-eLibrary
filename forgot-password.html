
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | BTU ELIBRARY</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body class="login-page">

    <header class="site-header">
        <div class="brand">
            <div class="brand-icon">B</div>
            <div>
                <h1>BTU ELIBRARY</h1>
                <p>Bomet University</p>
            </div>
        </div>

        <a href="login.html" class="login-button">Back to Sign In</a>
    </header>

    <main class="login-container">
        <section class="login-card">
            <h2>Reset Your Password</h2>

            <p class="login-description">
                Enter your university email address to begin
                recovering access to your account.
            </p>

            <form id="reset-password-form">
                <div class="form-group">
                    <label for="reset-email">University Email</label>
                    <input
                        type="email"
                        id="reset-email"
                        name="email"
                        placeholder="Enter your university email"
                        required
                    >
                </div>

                <button type="submit" class="sign-in-button">
                    Request Password Reset
                </button>
            </form>

            <p class="login-note">
                If you cannot access your university email,
                contact the university's authorized IT support team.
            </p>
        </section>
    </main>

</body>
</html>
